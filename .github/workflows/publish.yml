name: Build Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag (e.g. v1.0.0 or v1.0.0-alpha.1)"
        required: true
        type: string
      dry_run:
        description: "Build and verify without uploading to the Release"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Set package version from release tag
        run: node scripts/set-release-version.mjs "$RELEASE_TAG"
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
      - name: Build tarball
        run: |
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts
      - name: Verify packed CLI with Node.js and Bun
        run: npm run test:package -- ".artifacts/axt-arcane-bundler-${RELEASE_TAG#v}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .artifacts/*.tgz
      - name: Upload package to Release
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" .artifacts/*.tgz --clobber
