name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.13.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
      - run: npm run build
      - name: Pack and verify CLI
        if: runner.os == 'Linux'
        run: |
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts
          npm run test:package -- .artifacts/axt-arcane-bundler-0.0.0.tgz
